
<!DOCTYPE html>
<html>
<head>
  <title>Online Course Registration</title>
</head>
<body>

  <h2>Online Course Registration</h2>

  <form action="thankyou.html" target="_blank">

    <input type="hidden" name="form" value="Online Course Registration">

    <label for="name">Student Name:</label>
    <input type="text" id="name" placeholder="Enter your name" required><br>

    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Enter your email" required><br>

    <label for="mobile">Mobile Number:</label>
    <input type="tel" id="mobile" placeholder="10 digit number" maxlength="10" required><br>

    <label for="age">Age:</label>
    <input type="number" id="age" min="15" value="18"><br>

    <label for="pass">Password:</label>
    <input type="password" id="pass" minlength="6" required><br>

    Gender:
    <input type="radio" id="m" name="gender" required>
    <label for="m">Male</label>
    <input type="radio" id="f" name="gender">
    <label for="f">Female</label>
    <input type="radio" id="o" name="gender">
    <label for="o">Other</label><br>

    Skills:
    <input type="checkbox" id="html">
    <label for="html">HTML</label>
    <input type="checkbox" id="css">
    <label for="css">CSS</label>
    <input type="checkbox" id="js">
    <label for="js">JavaScript</label>
    <input type="checkbox" id="py">
    <label for="py">Python</label><br>

    <label for="course">Course:</label>
    <select id="course" required>
      <option value="">--Select--</option>
      <option>Web Development</option>
      <option>Python Programming</option>
      <option>Data Analytics</option>
      <option>Digital Marketing</option>
    </select><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob"><br>

    <label for="time">Preferred Class Time:</label>
    <input type="time" id="time"><br>

    <label for="address">Address:</label><br>
    <textarea id="address" rows="4" cols="40" placeholder="Write here"></textarea><br>

    <label for="file">Upload Document:</label>
    <input type="file" id="file"><br>

    <input type="submit">
    <input type="reset">

  </form>

</body>
</html>
