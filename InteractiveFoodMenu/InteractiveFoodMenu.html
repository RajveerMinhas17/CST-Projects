
<!DOCTYPE html>
<html>
<head>
  <title>Interactive Restaurant Menu</title>
</head>
<body>

  <h1 align="center">Interactive Restaurant Menu</h1>
  <p align="center">Click on a food item to see more information.</p>

  <p align="center">
    <img src="food.jpg" alt="Restaurant Food" width="800" height="500" usemap="#foodmap">
  </p>

  <map name="foodmap">

    <area shape="circle" coords="170,170,100" href="https://en.wikipedia.org/wiki/Pizza" alt="Pizza" target="_blank">
    <area shape="circle" coords="600,160,85" href="https://en.wikipedia.org/wiki/Hamburger" alt="Burger" target="_blank">

    <area shape="rect" coords="40,320,220,470" href="https://en.wikipedia.org/wiki/French_fries" alt="French Fries" target="_blank">
    <area shape="rect" coords="260,310,400,470" href="https://en.wikipedia.org/wiki/Menu" alt="Menu Card" target="_blank">

    <area shape="poly" coords="440,470,540,320,640,470" href="https://en.wikipedia.org/wiki/Sandwich" alt="Sandwich" target="_blank">
    <area shape="poly" coords="330,190,470,190,470,110,330,150" href="https://en.wikipedia.org/wiki/Cake" alt="Cake Slice" target="_blank">

    <area shape="default" href="https://en.wikipedia.org/wiki/Restaurant" alt="Remaining Area" target="_blank">
  </map>

</body>
</html>
